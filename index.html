<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hunt the Wumpus — 3D & Speech Edition</title>
    <link rel="stylesheet" href="css/style.css">

    <script>
    window.addEventListener('error', (e) => {
        console.error('Captured window error:', e.message, 'at', e.filename, 'line', e.lineno);
    });
    window.addEventListener('unhandledrejection', (e) => {
        console.error('Unhandled promise rejection:', e.reason);
    });
    </script>

    <!-- Importmap for Three.js 0.187.0 (Vendored for 100% Offline Access) -->
    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js",
            "three/addons/": "./vendor/three/addons/"
        }
    }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Text & Terminal Console Panel -->
        <div class="text-panel">
            <div class="terminal-header">
                <span class="terminal-title">Console Terminal</span>
                <button class="terminal-close-btn" id="terminal-close-btn" title="Back to 3D View">✕</button>
            </div>
            <div class="terminal-log" id="terminal-log"></div>
            <div class="input-container">
                <span class="input-prompt-label">&gt;</span>
                <input class="input-box" type="text" id="input" placeholder="Type a command (e.g. 'move 14', 'shoot 15,6', 'help')..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button class="enter-button" id="btn-enter" onclick="if(window.app) window.app.handleCommand(document.getElementById('input').value); document.getElementById('input').value='';">Enter</button>
            </div>
        </div>

        <!-- 3D Cave Visualizer Panel -->
        <div class="viz-panel" id="viz-panel">
            <canvas id="c"></canvas>
            <div class="hud-overlay" id="hud-overlay"></div>
        </div>
    </div>

    <!-- Main Module Application -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
